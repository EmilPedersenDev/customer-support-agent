<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 4rem);
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      #chat-log {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 0.75rem;
        background: #fafafa;
        margin-bottom: 0.75rem;
        min-height: 12rem;
      }
      .msg {
        margin-bottom: 0.75rem;
        padding: 0.5rem 0.65rem;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg:last-child {
        margin-bottom: 0;
      }
      .msg-user {
        background: #e8f0fe;
        margin-left: 1.5rem;
      }
      .msg-assistant {
        background: #f0f0f0;
        margin-right: 1.5rem;
      }
      .msg-role {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin-bottom: 0.25rem;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
      }
      #question {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        margin-bottom: 0.75rem;
      }
      button {
        padding: 0.45rem 1rem;
      }
      #status {
        margin-top: 0.5rem;
        color: #444;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Chat</h1>
    <div id="chat-log" aria-live="polite" aria-relevant="additions text"></div>
    <form id="ask-form" aria-label="Send a message">
      <label for="question">Message</label>
      <input
        id="question"
        name="question"
        type="text"
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
